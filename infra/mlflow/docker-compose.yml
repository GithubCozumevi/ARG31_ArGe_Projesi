services:
  mlflow-db:
    image: postgres:16
    container_name: masraf-mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks:
      - shared-infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: masraf-mlflow
    restart: unless-stopped
    depends_on:
      mlflow-db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      # MLflow'un deney/parametre/metrik kayitlarini tuttugu veritabani
      BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mlflow-db:5432/${POSTGRES_DB}
      # Model dosyalarinin (artifact) fiziksel olarak gidecegi yer: MinIO
      DEFAULT_ARTIFACT_ROOT: s3://${MLFLOW_BUCKET_NAME}/
      # MinIO'ya S3 uyumlu istemci gibi baglanmak icin gereken degiskenler
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mlflow-db:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --serve-artifacts
    networks:
      - shared-infra

volumes:
  mlflow_db_data:
    driver: local

networks:
  shared-infra:
    external: true   # MinIO'nun olusturdugu network'e disaridan katiliyoruz