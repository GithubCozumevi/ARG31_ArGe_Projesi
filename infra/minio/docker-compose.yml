services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: masraf-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API portu (kod buradan konuşur)
      - "9001:9001"   # Web Console portu (tarayıcı arayüzü)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data   # verinin container dışında kalıcı olarak saklandığı yer
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shared-infra

volumes:
  minio_data:
    driver: local

networks:
  shared-infra:
    name: shared-infra
    driver: bridge